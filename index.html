<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff3131">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Şef Ordusu! · feast.</title>
  <meta name="description" content="45 saniye oynayın, feast dünyasına adım atın! Bıyıklı Şef'in ekibini büyüt, aç kalabalığı doyur — sonra gerçek lezzetleri feast'te keşfet.">
  <meta property="og:title" content="Şef Ordusu! · feast.">
  <meta property="og:description" content="45 saniye oynayın, feast dünyasına adım atın! Sen 45 saniyede kaç kişiyi doyurursun?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://games.feast.tr/">
  <meta property="og:site_name" content="feast.">
  <meta property="og:image" content="https://games.feast.tr/assets/og-share.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Şef Ordusu! — 45 saniyede kaç kişiyi doyurursun?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://games.feast.tr/assets/og-share.jpg?v=2">
  <meta name="apple-itunes-app" content="app-id=6762010641">
  <link rel="icon" href="assets/chef-head.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/chef-head.png">
  <link rel="preload" href="assets/toss.webp" as="image" type="image/webp">
  <link rel="modulepreload" href="js/game.js">
  <link rel="modulepreload" href="js/logic.js">
  <link rel="modulepreload" href="js/art.js">
  <link rel="modulepreload" href="js/squad-logic.js">
  <link rel="modulepreload" href="js/scenery.js">
  <link rel="modulepreload" href="js/crowd-art.js">
  <link rel="modulepreload" href="js/fx.js">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reward.css">
</head>
<body>
  <canvas id="stage" aria-label="Oyun alanı" data-i18n-aria="ariaGame"></canvas>

  <div id="hud" hidden>
    <div class="hud-timer">
      <span class="hud-clock" aria-live="off">⏱ <span id="hud-left">45</span></span>
      <div class="hud-bar"><div id="hud-time"></div></div>
    </div>
    <div class="hud-row">
      <div class="hud-score"><span id="hud-score">0</span></div>
      <div class="hud-squad" aria-live="polite">👨‍🍳 <span id="hud-count">0</span></div>
    </div>
    <div class="hud-row hud-sub">
      <div class="hud-pill"><span id="hud-meters">0</span> <span data-i18n="meters">m</span></div>
      <div class="hud-pill hud-pins">📍 <span id="hud-pins">0</span></div>
    </div>
  </div>

  <button id="btn-mute" class="btn-mute" type="button" aria-pressed="false" aria-label="Ses" data-i18n-aria="sound">🔊</button>

  <!-- INTRO (first screen) -->
  <section id="intro" class="screen intro is-active" aria-live="polite">
    <!-- 1–2: one hypnotic spiral (built in reward-ui.js) that keeps spinning
         across both steps, then collapses into the centre -->
    <div class="intro-vortex" aria-hidden="true"><div class="intro-vortex-spin"></div></div>
    <div class="intro-frame" data-frame="mystery"><span class="intro-q" aria-hidden="true">?</span></div>
    <div class="intro-frame" data-frame="swirl" aria-hidden="true"><span class="intro-q" aria-hidden="true">?</span></div>
    <!-- 3: feast-coloured rings burst out of the point the spiral collapsed into -->
    <div class="intro-frame" data-frame="scribble" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="intro-frame" data-frame="brand">
      <div class="intro-brand">
        <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <small class="intro-lead" data-i18n="introLead"></small>
      </div>
    </div>
    <div class="intro-frame" data-frame="promise">
      <p class="intro-promise">
        <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <small data-i18n="introLead"></small>
        <span data-i18n="introPromise"></span>
        <em class="sparkle" data-i18n="introHot"></em>
        <span data-i18n="introTail"></span>
      </p>
    </div>
    <div class="intro-frame intro-ready" data-frame="ready">
      <!-- faint "what should we eat?" thought bubbles drifting behind (filled by reward-ui.js) -->
      <div class="ready-bubbles" aria-hidden="true"></div>
      <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
      <small class="intro-lead" data-i18n="introLead"></small>
      <img class="intro-chef" src="assets/toss.webp" alt="" width="317" height="480">
      <h1 data-i18n="readyMain"></h1>
      <strong class="sparkle intro-hot" data-i18n="readyHot"></strong>
      <button id="btn-reward-play" class="btn btn-primary btn-pulse" type="button" data-i18n="readyPlay"></button>
    </div>
  </section>

  <!-- REWARD FLOW: mystery box after the round -->
  <section id="box" class="screen box-screen">
    <div class="box-wrap">
      <h2 data-i18n="boxTitle"></h2>
      <button id="btn-box" class="mystery-box" type="button" aria-label="Ödül kutusunu aç" data-i18n-aria="boxOpen">
        <span class="box-body" aria-hidden="true"><span class="box-ribbon"></span><span class="box-medal">?</span></span>
        <span class="box-lid" aria-hidden="true"><span class="box-ribbon"></span><span class="box-bow"><span class="box-knot"></span></span></span>
        <span class="box-twinkles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="box-burst" aria-hidden="true"></span>
        <span class="box-sparks" aria-hidden="true"></span>
      </button>
      <p class="hint" data-i18n="boxHint"></p>
    </div>
    <div class="box-flash" aria-hidden="true"></div>
  </section>

  <!-- REWARD FLOW: "feast nedir?" explainer after the box opens (8 s, plays
       through on its own). Look follows @feast_tr's "feast nedir?" highlight: red
       background, white caption on top, the app inside a phone. Scenes switch
       on data-step (reward-ui.js playExplainer); every cut punches the camera
       and flashes. Word lists, reels and chat come from the config. -->
  <section id="explainer" class="screen explainer" aria-live="polite">
    <div class="ex-cam">
      <span class="ex-swoosh" aria-hidden="true"></span>

      <div class="ex-scene" data-scene="hook"><p class="ex-hook"></p></div>

      <div class="ex-scene" data-scene="brand">
        <img class="ex-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <p class="ex-words"></p>
      </div>

      <div class="ex-stage">
        <p class="ex-caption">
          <span data-cap="map" data-i18n="exMap"></span>
          <span data-cap="reels" data-i18n="exReels"></span>
          <span data-cap="friends" data-i18n="exFriends"></span>
        </p>
        <div class="ex-phone-wrap">
          <strong class="ex-sticker" aria-hidden="true" data-i18n="exSticker"></strong>
          <div class="ex-phone" aria-hidden="true">
            <span class="ex-island"></span>

            <div class="ex-screen ex-map">
              <span class="ex-park"></span>
              <svg class="ex-route" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 58 L50 70 L28 70 L28 84" pathLength="1"/></svg>
              <span class="ex-me"></span>
              <span class="ex-pin" style="--x:28%;--y:84%;--d:.1s">🍕</span>
              <span class="ex-pin" style="--x:74%;--y:30%;--d:.25s">🍔</span>
              <span class="ex-pin" style="--x:22%;--y:34%;--d:.4s">☕</span>
              <span class="ex-pin" style="--x:78%;--y:66%;--d:.55s">🍣</span>
              <span class="ex-eta">🚶 6 dk</span>
            </div>

            <div class="ex-screen ex-reels"><div class="ex-reel-track"></div><span class="ex-touch"></span></div>


            <div class="ex-screen ex-chat">
              <b class="ex-chat-head"><span>🍕</span> feast</b>
              <p class="ex-msg"></p>
              <p class="ex-msg ex-mine"></p>
              <p class="ex-msg ex-mine ex-share"><img src="assets/cuisine/pizza.webp" alt=""><span>Margherita Pizza · ₺340</span></p>
              <p class="ex-msg"></p>
            </div>

            <nav class="ex-tabbar">
              <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              <svg viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/></svg>
            </nav>
          </div>
        </div>
      </div>
    </div>
    <div class="ex-progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="ex-flash" aria-hidden="true"></span>
  </section>

  <!-- REWARD FLOW: lost before 45 s → one more try (REWARD_CONFIG.onLose = 'retry') -->
  <section id="retry" class="screen retry-screen">
    <div class="retry-wrap">
      <div class="retry-gift" aria-hidden="true"><span class="retry-gift-box">🎁</span><span class="retry-lock">🔒</span></div>
      <h2 class="retry-title" data-i18n="retryTitle"></h2>
      <p id="retry-sub" class="retry-sub"></p>
      <button class="btn btn-primary btn-pulse retry-btn" type="button" data-action="again" data-i18n="retryButton"></button>
      <p class="retry-tip" data-i18n="retryTip"></p>
      <p id="retry-score" class="retry-score"></p>
    </div>
  </section>

  <!-- REWARD FLOW: unlocked reward -->
  <!-- Download page after the box opens: big title, the open gift glowing,
       one big yellow download button, both store badges. No QR. -->
  <section id="reward" class="screen reward-screen">
    <div class="confetti" aria-hidden="true">
      <i style="--x:6%;--y:34%;--r:-30deg;--c:#ff4d6d"></i>
      <i style="--x:14%;--y:12%;--r:40deg;--c:#ffc83d"></i>
      <i style="--x:20%;--y:48%;--r:70deg;--c:#7c5cff"></i>
      <i style="--x:8%;--y:62%;--r:-60deg;--c:#ffc83d"></i>
      <i style="--x:16%;--y:80%;--r:20deg;--c:#ff8fab"></i>
      <i style="--x:84%;--y:10%;--r:-40deg;--c:#ff8a00"></i>
      <i style="--x:88%;--y:28%;--r:30deg;--c:#e84ae0"></i>
      <i style="--x:78%;--y:44%;--r:-70deg;--c:#ffc83d"></i>
      <i style="--x:90%;--y:58%;--r:60deg;--c:#ff4d6d"></i>
      <i style="--x:82%;--y:76%;--r:-20deg;--c:#7c5cff"></i>
      <i style="--x:30%;--y:6%;--r:15deg;--c:#ff4d6d"></i>
      <i style="--x:66%;--y:5%;--r:-15deg;--c:#ffc83d"></i>
    </div>
    <div class="reward-wrap">
      <div class="reward-head">
        <h2 class="reward-title" data-i18n="rewardTitle"></h2>
        <p class="reward-sub" data-i18n="rewardSub"></p>
      </div>
      <!-- The gift with the unlocked places floating gently around it. -->
      <div class="gift-stage">
        <div class="gift-open" aria-hidden="true">
          <span class="gift-beams"></span>
          <span class="gift-lid"><span class="box-ribbon"></span><span class="box-bow"><span class="box-knot"></span></span></span>
          <span class="gift-body">
            <span class="gift-mouth"></span>
            <span class="box-ribbon"></span>
            <span class="gift-medal"></span>
          </span>
          <span class="box-twinkles"><i></i><i></i><i></i><i></i></span>
          <span class="pods-badge">×3</span>
          <!-- the prize rising out of the box: generic earbuds case (no logo) -->
          <svg class="pods" viewBox="0 0 120 132" stroke="#3a1d10" stroke-width="4" stroke-linejoin="round">
            <defs><linearGradient id="podsShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e4dfd8"/></linearGradient></defs>
            <rect x="12" y="6" width="96" height="34" rx="17" fill="url(#podsShade)" transform="rotate(-16 14 40)"/>
            <g fill="#fff"><rect x="34" y="34" width="13" height="34" rx="6.5"/><circle cx="40.5" cy="34" r="12"/><rect x="73" y="34" width="13" height="34" rx="6.5"/><circle cx="79.5" cy="34" r="12"/></g>
            <path d="M10 54h100v36a36 36 0 0 1-36 36H46a36 36 0 0 1-36-36z" fill="url(#podsShade)"/>
            <path d="M22 64v22a24 24 0 0 0 10 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <circle cx="60" cy="100" r="3" fill="#7fe07f" stroke-width="2"/>
          </svg>
        </div>
        <span class="float-word" style="--d:.2s;--r:-6deg;--t:3.2s;left:0;top:6%" data-i18n="rewardPlaceCampus"></span>
        <span class="float-word" style="--d:.45s;--r:5deg;--t:3.6s;right:0;top:20%">📍 Kadıköy</span>
        <span class="float-word" style="--d:.7s;--r:4deg;--t:3.4s;left:1%;top:60%">📍 Beşiktaş</span>
        <span class="float-word float-more" style="--d:.95s;--r:-4deg;--t:3.8s;right:0;top:64%" data-i18n="rewardMore"></span>
      </div>
      <div class="reward-actions">
        <!-- Always goes to get.feast.tr (REWARD_CONFIG.downloadUrl), on every device. -->
        <a class="btn reward-download" data-store-main href="https://get.feast.tr" target="_top" rel="noopener">
          <svg class="dl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M5 17v2.5h14V17" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="rewardDownload"></span>
        </a>
        <p class="reward-tagline"><span data-i18n="rewardTagline"></span> <span class="heart" aria-hidden="true">♡</span></p>
        <a class="reward-terms" data-terms hidden target="_blank" rel="noopener" data-i18n="rewardTerms"></a>
        <p class="reward-meta">
          <span id="reward-score"></span>
          <button class="link-btn" type="button" data-action="again" data-i18n="again"></button>
          <button class="link-btn" type="button" data-action="share" data-i18n="share"></button>
        </p>
      </div>
    </div>
  </section>

  <!-- PLAY (canvas + HUD only) -->
  <section id="play" class="screen" aria-hidden="true"></section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
