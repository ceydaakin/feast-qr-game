<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff3131">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Şef Ordusu! · feast.</title>
  <meta name="description" content="45 saniye oynayın, feast dünyasına adım atın! Bıyıklı Şef'in ekibini büyüt, aç kalabalığı doyur — sonra gerçek lezzetleri feast'te keşfet.">
  <meta property="og:title" content="Şef Ordusu! · feast.">
  <meta property="og:description" content="45 saniye oynayın, feast dünyasına adım atın! Sen 45 saniyede kaç kişiyi doyurursun?">
  <meta property="og:image" content="assets/toss.webp">
  <meta name="apple-itunes-app" content="app-id=6762010641">
  <link rel="icon" href="assets/chef-head.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/chef-head.png">
  <link rel="preload" href="assets/toss.webp" as="image" type="image/webp">
  <link rel="modulepreload" href="js/game.js">
  <link rel="modulepreload" href="js/logic.js">
  <link rel="modulepreload" href="js/art.js">
  <link rel="modulepreload" href="js/squad-logic.js">
  <link rel="modulepreload" href="js/scenery.js">
  <link rel="modulepreload" href="js/crowd-art.js">
  <link rel="modulepreload" href="js/fx.js">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reward.css">
</head>
<body>
  <canvas id="stage" aria-label="Oyun alanı" data-i18n-aria="ariaGame"></canvas>

  <div id="hud" hidden>
    <div class="hud-timer">
      <span class="hud-clock" aria-live="off">⏱ <span id="hud-left">45</span></span>
      <div class="hud-bar"><div id="hud-time"></div></div>
    </div>
    <div class="hud-row">
      <div class="hud-score"><span id="hud-score">0</span></div>
      <div class="hud-squad" aria-live="polite">👨‍🍳 <span id="hud-count">0</span></div>
    </div>
    <div class="hud-row hud-sub">
      <div class="hud-pill"><span id="hud-meters">0</span> <span data-i18n="meters">m</span></div>
      <div class="hud-pill hud-pins">📍 <span id="hud-pins">0</span></div>
    </div>
  </div>

  <button id="btn-mute" class="btn-mute" type="button" aria-pressed="false" aria-label="Ses" data-i18n-aria="sound">🔊</button>

  <!-- START -->
  <section id="start" class="screen scrollable is-active">
    <div class="card start-card">
      <div class="start-hero">
        <img class="logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <img class="hero-chef" src="assets/toss.webp" alt="" width="317" height="480" fetchpriority="high">
        <p class="round-badge"><span aria-hidden="true">⏱</span> <span data-i18n="roundBadge"></span></p>
      </div>
      <div class="start-body">
        <h1 data-i18n="headline">45 saniye oynayın, feast dünyasına adım atın!</h1>
        <p class="sub" data-i18n="subtitle"></p>
        <div class="legend">
          <div class="legend-group good"><span data-i18n="howGates"></span><div data-legend="gates"></div></div>
          <div class="legend-group bad"><span data-i18n="howFeed"></span><div data-legend="eaters"></div></div>
        </div>
        <div class="legend-chips">
          <div class="legend-bonus legend-discover"><span aria-hidden="true">🔒</span><span data-i18n="howDiscover"></span></div>
          <div class="legend-bonus"><span aria-hidden="true">👑</span><span data-i18n="howBoss"></span></div>
        </div>
        <button id="btn-play" class="btn btn-primary btn-pulse" type="button" data-i18n="play">45 saniye oyna</button>
        <p class="hint">👆 <span data-i18n="howDrag"></span></p>
        <p id="start-best" class="best"></p>
        <div class="ticker" aria-live="polite"><span id="ticker-text"></span></div>
        <a class="link-app" data-store="start" href="#" target="_top" rel="noopener" data-i18n="skipToApp"></a>
      </div>
    </div>
  </section>

  <!-- REWARD FLOW INTRO (only themes with flow: 'reward') -->
  <section id="intro" class="screen intro" aria-live="polite">
    <div class="intro-frame" data-frame="mystery"><span class="intro-q" aria-hidden="true">?</span></div>
    <div class="intro-frame" data-frame="swirl" aria-hidden="true"></div>
    <div class="intro-frame" data-frame="scribble" aria-hidden="true"></div>
    <div class="intro-frame" data-frame="brand">
      <div class="intro-brand">
        <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <small class="intro-lead" data-i18n="introLead"></small>
      </div>
    </div>
    <div class="intro-frame" data-frame="promise">
      <p class="intro-promise">
        <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        <small data-i18n="introLead"></small>
        <span data-i18n="introPromise"></span>
        <em class="sparkle" data-i18n="introHot"></em>
        <span data-i18n="introTail"></span>
      </p>
    </div>
    <div class="intro-frame intro-ready" data-frame="ready">
      <img class="intro-logo" src="assets/logo.webp" alt="feast." width="120" height="33">
      <small class="intro-lead" data-i18n="introLead"></small>
      <h1 data-i18n="readyMain"></h1>
      <strong class="sparkle intro-hot" data-i18n="readyHot"></strong>
      <button id="btn-reward-play" class="btn btn-primary btn-pulse" type="button" data-i18n="readyPlay"></button>
    </div>
  </section>

  <!-- REWARD FLOW: mystery box after the round -->
  <section id="box" class="screen box-screen">
    <div class="box-wrap">
      <h2 data-i18n="boxTitle"></h2>
      <button id="btn-box" class="mystery-box" type="button" aria-label="Ödül kutusunu aç" data-i18n-aria="boxOpen">
        <span class="box-lid" aria-hidden="true">?</span>
        <span class="box-body" aria-hidden="true">?</span>
        <span class="box-burst" aria-hidden="true"></span>
        <span class="box-sparks" aria-hidden="true"></span>
      </button>
      <p class="hint" data-i18n="boxHint"></p>
    </div>
    <div class="box-flash" aria-hidden="true"></div>
  </section>

  <!-- REWARD FLOW: unlocked reward -->
  <section id="reward" class="screen">
    <div class="card reward-card">
      <div class="reward-main">
        <div class="reward-head">
          <div class="chef-sticker"><img src="assets/chef-head.webp" alt="" width="44" height="44"><span data-i18n="chefPick"></span></div>
          <img class="logo" src="assets/logo.webp" alt="feast." width="120" height="33">
        </div>
        <h2 class="reward-title" data-i18n="rewardTitle"></h2>
        <div class="reward-places">
          <ul id="reward-places" class="place-cards"></ul>
          <span data-i18n="rewardPlaces"></span>
        </div>
        <div class="reward-friends">
          <div id="reward-avatars" class="avatar-stack" aria-hidden="true"></div>
          <span data-i18n="rewardFriends"></span>
        </div>
        <a class="btn btn-primary btn-pulse reward-collect" data-store="reward" href="#" target="_top" rel="noopener" data-i18n="rewardCollect"></a>
        <div class="app-qr" data-desktop-only>
          <img src="assets/store-qr.svg" loading="lazy" alt="feast. uygulamasını indirme QR kodu" data-i18n-alt="altStoreQr" width="132" height="132">
          <div class="app-qr-text">
            <b data-i18n="qrTitle"></b>
            <small data-i18n="qrHint" data-i18n-platform></small>
          </div>
        </div>
      </div>
      <div class="reward-side">
        <div class="reward-chat">
          <div class="reward-chat-head"><b data-i18n="rewardChatTitle"></b><small data-i18n="rewardChatNote"></small></div>
          <div class="chat-body">
            <ul id="reward-chat" class="chat-lines" aria-hidden="true"></ul>
            <p class="reward-chat-lock" data-i18n="rewardChatLock"></p>
          </div>
        </div>
        <p id="reward-score" class="stats"></p>
        <div class="row">
          <button class="btn btn-ghost" type="button" data-action="again" data-i18n="again"></button>
          <button class="btn btn-ghost" type="button" data-action="share" data-i18n="share"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- PLAY (canvas + HUD only) -->
  <section id="play" class="screen" aria-hidden="true"></section>

  <!-- GAME OVER -->
  <section id="over" class="screen scrollable">
    <div class="card over-card">
      <h2 id="over-title"></h2>
      <div class="rank-badge"><img src="assets/chef3.webp" alt="" width="64" height="80"><span id="over-rank"></span></div>
      <div class="score-big"><span id="over-score">0</span><small data-i18n="points"></small></div>
      <p id="over-best" class="best"></p>
      <p id="over-stats" class="stats"></p>
      <p id="over-discovered" class="discovered" hidden></p>

      <div class="craving">
        <h3 data-i18n="cravingTitle"></h3>
        <div id="craving-grid" class="craving-grid"></div>
      </div>

      <div id="cta" class="cta">
        <div class="chef-sticker"><img src="assets/chef-head.webp" alt="" width="44" height="44"><span data-i18n="chefPick"></span></div>
        <img class="cta-logo" src="assets/logo.webp" alt="feast." width="96" height="26">
        <h3 id="cta-title" data-i18n="ctaTitle"></h3>
        <p data-i18n="ctaBody"></p>
        <ul class="cta-points">
          <li><span aria-hidden="true">📍</span><span data-i18n="ctaPoint1"></span></li>
          <li><span aria-hidden="true">📖</span><span data-i18n="ctaPoint2"></span></li>
          <li><span aria-hidden="true">👥</span><span data-i18n="ctaPoint3"></span></li>
        </ul>
        <a class="btn btn-store" data-store="over" href="#" target="_top" rel="noopener">
          <span aria-hidden="true">⬇</span> <span data-i18n="ctaButton" data-i18n-platform></span>
        </a>
        <p class="cta-free" data-store-only data-i18n="ctaFree"></p>
        <ol class="cta-steps" data-store-only>
          <li><b>1</b><span data-i18n="step1"></span></li>
          <li><b>2</b><span data-i18n="step2" data-i18n-platform></span></li>
          <li><b>3</b><span data-i18n="step3"></span></li>
        </ol>
        <div class="app-qr">
          <img src="assets/store-qr.svg" loading="lazy" alt="feast. uygulamasını indirme QR kodu" data-i18n-alt="altStoreQr" width="132" height="132">
          <div class="app-qr-text">
            <b data-i18n="qrTitle"></b>
            <span data-i18n="qrBody"></span>
            <small data-i18n="qrHint" data-i18n-platform></small>
          </div>
        </div>
      </div>

      <div class="row">
        <button id="btn-again" class="btn btn-ghost" type="button" data-action="again" data-i18n="again"></button>
        <button id="btn-share" class="btn btn-ghost" type="button" data-action="share" data-i18n="share"></button>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
